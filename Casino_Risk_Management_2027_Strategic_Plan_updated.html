/* ───────── SVG visual vocabulary ───────── */
.viz svg text{font-family:var(--f-cond)}
.v-node{fill:#0E1A27;stroke:#00D8F6;stroke-width:2}
.v-soft{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.26);stroke-width:1.4}
.v-line{fill:none;stroke:rgba(0,216,246,.4);stroke-width:2.2}
.v-flow{fill:none;stroke:#00D8F6;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2 10;animation:flow 1.2s linear infinite}
.v-txt{fill:#F3F8FD;font-weight:700;font-size:17px;text-anchor:middle;dominant-baseline:central;letter-spacing:.05em}
.v-txt.dark{fill:#03141D;font-size:30px}
.v-ico{fill:none;stroke:#00D8F6;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.v-ico.dark{stroke:#03141D;stroke-width:2.2}
.v-icoF{fill:#00D8F6;stroke:none}
.v-orbit{fill:none;stroke:rgba(0,216,246,.3);stroke-width:1.3;stroke-dasharray:3 8;transform-origin:210px 190px;animation:spin 70s linear infinite}
.v-spin{transform-origin:210px 190px;animation:spin 16s linear infinite}
.v-halo{fill:none;stroke:rgba(0,216,246,.6);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:halo 2.8s ease-out infinite}
.v-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.v-gear{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
.v-arc{fill:none;stroke-width:24;stroke-dasharray:48.3 100;animation:draw 1.5s cubic-bezier(.3,.7,.2,1) both}
.v-dot{fill:var(--c);animation:sort 9s cubic-bezier(.65,0,.35,1) infinite both}
.v-bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s cubic-bezier(.5,0,.2,1) infinite both}
.v-grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow2 5s cubic-bezier(.5,0,.2,1) infinite both}
.v-seat{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--n,0)*55ms + 350ms)}
.v-ghost{fill:none;stroke:rgba(0,216,246,.7);stroke-width:1.6;stroke-dasharray:3 4;animation:ghost 3.2s ease-in-out infinite}
.v-sla{fill:none;stroke:url(#gCy);stroke-width:7;stroke-linecap:round;animation:sla 6s ease-in-out infinite both}
.v-block{animation:blocks 6s ease-in-out infinite both;animation-delay:calc(var(--b,0)*140ms)}

@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes halo{0%{transform:scale(.88);opacity:.95}100%{transform:scale(1.45);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.8}}
@keyframes draw{from{stroke-dashoffset:48.3}to{stroke-dashoffset:0}}
@keyframes sort{
  0%,8%{transform:translate(var(--dx),var(--dy));fill:rgba(255,255,255,.6)}
  36%,64%{transform:none;fill:var(--c)}
  92%,100%{transform:translate(var(--dx),var(--dy));fill:rgba(255,255,255,.6)}
}
@keyframes grow{0%,34%{transform:scaleY(.1)}56%,90%{transform:scaleY(1)}100%{transform:scaleY(.1)}}
@keyframes grow2{0%{transform:scaleY(.15)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ghost{0%,100%{opacity:.85}50%{opacity:.25}}
@keyframes sla{0%,12%{stroke-dasharray:92 100}55%,100%{stroke-dasharray:34 100}}
@keyframes blocks{0%,10%{opacity:1}40%,85%{opacity:.14}100%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fillm{from{transform:scaleX(0)}to{transform:scaleX(1)}}


:root{--cyan:#00D8F6;--blue:#00A3FF;--grad:linear-gradient(135deg,#00D8F6 0%,#00A3FF 100%);--text:#F3F8FD;--muted:#C6D2E0;--faint:#97A9BE;--line:rgba(0,216,246,.32);--soft:rgba(255,255,255,.12);
--f-hy:"Mardoto","Noto Sans Armenian","Sylfaen","Segoe UI",system-ui,sans-serif;--f-lat:"Roboto","Segoe UI",system-ui,Arial,sans-serif;--f-cond:"Roboto Condensed","Roboto","Arial Narrow",Arial,sans-serif;--f-body:var(--f-lat);--f-head:var(--f-cond);color-scheme:dark}
html[lang="hy"]{--f-body:var(--f-hy);--f-head:var(--f-hy)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#03060c;color:var(--text);font-family:var(--f-body);font-weight:500;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="hy"] .row p,html[lang="hy"] .gsub,html[lang="hy"] .label,html[lang="hy"] .viz-cap,html[lang="hy"] .kicker,html[lang="hy"] #u-hint{-webkit-text-stroke:.35px currentColor}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:4px;border-radius:10px}
::selection{background:rgba(0,216,246,.32)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:visible;--si:0;--px:0px;--py:0px}
/* background */
.aur i{position:absolute;border-radius:50%;transition:transform 1.8s cubic-bezier(.2,.7,.1,1);animation:drift 24s ease-in-out infinite alternate}
.aur i:nth-child(1){width:1200px;height:1200px;left:-380px;top:-520px;background:radial-gradient(circle,rgba(0,216,246,.26),transparent 62%);transform:translate(calc(var(--si)*70px),calc(var(--si)*26px))}
.aur i:nth-child(2){width:1300px;height:1300px;right:-460px;bottom:-640px;background:radial-gradient(circle,rgba(0,163,255,.24),transparent 62%);transform:translate(calc(var(--si)*-60px),calc(var(--si)*-18px));animation-delay:-8s}
.aur i:nth-child(3){width:800px;height:800px;left:46%;top:18%;background:radial-gradient(circle,rgba(0,170,190,.12),transparent 65%);transform:translate(calc(var(--si)*-40px),calc(var(--si)*30px));animation-delay:-15s}
.gridbg{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 35% 35%,#000,transparent 75%);mask-image:radial-gradient(ellipse 80% 70% at 35% 35%,#000,transparent 75%);animation:gridmove 40s linear infinite}
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
#glow{position:absolute;left:0;top:0;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(0,216,246,.10),transparent 62%);transition:transform .35s ease-out;will-change:transform}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%)}
@keyframes drift{from{margin:0}to{margin:50px 0 0 -60px}}
@keyframes gridmove{to{background-position:72px 72px}}
/* top */
#tp{position:absolute;left:0;top:0;height:4px;width:100%;transform-origin:0 0;transform:scaleX(.143);background:var(--grad);box-shadow:0 0 18px 2px rgba(0,216,246,.8);transition:transform 1s cubic-bezier(.2,.7,.1,1);z-index:6}
.top{position:absolute;left:0;right:0;top:0;height:110px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 96px 0}
.brand{display:flex;align-items:center;gap:26px;min-width:0}
.logo{width:68px;height:68px;flex:none;filter:drop-shadow(0 0 22px rgba(0,216,246,.5))}
.vr{width:1px;height:56px;background:linear-gradient(transparent,rgba(0,216,246,.7),transparent)}
.kicker{margin:0;font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
html[lang="hy"] .kicker{text-transform:none;letter-spacing:.03em;font-size:22px}
.plan{margin:4px 0 0;font-family:var(--f-head);font-weight:700;font-size:34px;line-height:1.15}
.tools{display:flex;align-items:center;gap:18px}
.lang{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);backdrop-filter:blur(8px)}
.lang .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:999px;background:var(--grad);box-shadow:0 0 26px rgba(0,216,246,.55);transition:transform .45s cubic-bezier(.4,.1,.2,1)}
.lang[data-i="1"] .ind{transform:translateX(100%)}.lang[data-i="2"] .ind{transform:translateX(200%)}
.lang button{position:relative;z-index:1;min-width:84px;padding:14px 22px;border:0;border-radius:999px;background:none;cursor:pointer;font-family:var(--f-lat);font-weight:700;font-size:19px;letter-spacing:.08em;line-height:1;color:var(--muted);transition:color .3s}
.lang button:hover{color:#fff}.lang button[aria-pressed="true"]{color:#03141D}.lang button[data-l="hy"]{font-family:var(--f-hy)}
.ib{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(0,216,246,.07);color:var(--cyan);cursor:pointer;transition:background .25s,transform .25s,box-shadow .25s,opacity .25s}
.ib:hover:not(:disabled){background:rgba(0,216,246,.2);transform:scale(1.08);box-shadow:0 0 28px rgba(0,216,246,.35)}
.ib:disabled{opacity:.25;cursor:default}.ib svg{width:26px;height:26px}
/* slides */
#slides{position:absolute;left:0;right:0;top:110px;height:874px;z-index:2;perspective:1800px}
.slide{position:absolute;inset:0;padding:10px 96px 0}
.in-f{animation:inF 1.05s cubic-bezier(.16,.8,.2,1) both;z-index:2}.in-b{animation:inB 1.05s cubic-bezier(.16,.8,.2,1) both;z-index:2}
.out-f{animation:outF .8s cubic-bezier(.5,0,.2,1) both;z-index:1;pointer-events:none}.out-b{animation:outB .8s cubic-bezier(.5,0,.2,1) both;z-index:1;pointer-events:none}
.swap{animation:fadein .5s both}
@keyframes inF{from{clip-path:inset(0 0 0 100%);opacity:0;transform:translateX(90px) scale(1.05);filter:blur(14px)}60%{opacity:1}to{clip-path:inset(0);opacity:1;transform:none;filter:blur(0)}}
@keyframes inB{from{clip-path:inset(0 100% 0 0);opacity:0;transform:translateX(-90px) scale(1.05);filter:blur(14px)}60%{opacity:1}to{clip-path:inset(0);opacity:1;transform:none;filter:blur(0)}}
@keyframes outF{to{opacity:0;transform:translateX(-120px) scale(.93);filter:blur(12px)}}
@keyframes outB{to{opacity:0;transform:translateX(120px) scale(.93);filter:blur(12px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(34px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.rv{animation:rise .95s cubic-bezier(.16,.8,.2,1) both;animation-delay:var(--d,0ms)}
#sweep{position:absolute;top:0;bottom:0;left:-700px;width:700px;z-index:4;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent,rgba(0,216,246,.16) 45%,rgba(255,255,255,.22) 50%,rgba(0,216,246,.16) 55%,transparent);transform:skewX(-14deg)}
#sweep.go{animation:sweep 1.1s cubic-bezier(.5,0,.2,1)}#sweep.back{animation:sweepb 1.1s cubic-bezier(.5,0,.2,1)}
@keyframes sweep{0%{transform:translateX(0) skewX(-14deg);opacity:1}100%{transform:translateX(2900px) skewX(-14deg);opacity:1}}
@keyframes sweepb{0%{transform:translateX(2900px) skewX(-14deg);opacity:1}100%{transform:translateX(0) skewX(-14deg);opacity:1}}
.slide{display:grid;grid-template-columns:1040px minmax(0,1fr);gap:40px;align-items:center}
.ghost{position:absolute;right:20px;bottom:-150px;font:700 820px/1 var(--f-cond);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px rgba(0,216,246,.075);pointer-events:none;animation:fadein 1.6s .2s both}
.col{position:relative;z-index:1}
.lab{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.label{margin:0;font-size:20px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
html[lang="hy"] .label{text-transform:none;letter-spacing:.04em;font-size:22px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px 4px rgba(0,216,246,.7);animation:pulse 2.4s ease-in-out infinite}
.lab::after{content:"";height:1px;width:140px;background:linear-gradient(90deg,var(--line),transparent)}
.ttl{display:flex;align-items:flex-start;gap:30px}
.big{flex:none;font:700 150px/.82 var(--f-cond);letter-spacing:-.01em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(0,216,246,.4))}
.ttl h2{margin:0;padding-top:4px;font-family:var(--f-head);font-weight:700;font-size:50px;line-height:1.16}
.rows{margin-top:38px;position:relative}
.row{position:relative;display:grid;grid-template-columns:78px minmax(0,1fr);align-items:baseline;padding:21px 0 22px;border-top:1px solid var(--soft);transition:background .35s,padding .35s,opacity .3s}
.row:last-child{border-bottom:1px solid var(--soft)}
.row::after{content:"";position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--grad);box-shadow:0 0 14px rgba(0,216,246,.8);transform:scaleX(0);transform-origin:0 0;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.row:hover::after,.row:focus-visible::after{transform:scaleX(1)}
.row:hover{background:linear-gradient(90deg,rgba(0,216,246,.12),transparent 80%);padding-left:18px}
.idx{font:700 24px/1 var(--f-cond);letter-spacing:.12em;color:var(--cyan)}
.row h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:35px;line-height:1.22;color:#fff}
.row p{margin:8px 0 0;font-size:25px;line-height:1.42;color:var(--muted)}
.row.goal{margin-top:20px;padding:26px 30px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(100deg,rgba(0,216,246,.26),rgba(0,163,255,.05) 85%);box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 50px rgba(0,216,246,.1);overflow:hidden}
.row.goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--grad);box-shadow:0 0 22px rgba(0,216,246,.9)}
.row.goal::after{inset:0;height:auto;width:auto;top:0;left:-100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:none;box-shadow:none;transition:none;animation:shine 5s 1.6s ease-in-out infinite}
.row.goal:hover{padding-left:30px}.row:last-child.goal{border-bottom:1px solid var(--line)}
@keyframes shine{0%{left:-100%}35%,100%{left:120%}}
.flag{display:inline-flex;color:var(--cyan)}.flag svg{width:34px;height:34px}
.flag span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* viz zone */
.vzone{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translate(var(--px),var(--py));transition:transform .5s ease-out}
.rg{position:absolute;left:50%;top:46%;border-radius:50%;pointer-events:none}
.rg.a{width:780px;height:780px;margin:-390px 0 0 -390px;border:1px dashed rgba(0,216,246,.22);animation:spin 90s linear infinite}
.rg.b{width:700px;height:700px;margin:-350px 0 0 -350px;background:conic-gradient(from 0deg,transparent 0 62%,rgba(0,216,246,.55) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 14s linear infinite}
.vz{position:relative;width:100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.vz svg{display:block;width:100%;height:auto;overflow:visible}
.viz-cap{margin-top:14px;font-size:20px;color:var(--faint);text-align:center}
.vz svg text{font-family:var(--f-cond)}
/* linked highlight */
.slide[data-act] .v-k{opacity:.3}.slide[data-act] .row{opacity:.45}
.slide[data-act="1"] :is(.v-k,.row)[data-k="1"],.slide[data-act="2"] :is(.v-k,.row)[data-k="2"],.slide[data-act="3"] :is(.v-k,.row)[data-k="3"],.slide[data-act="4"] :is(.v-k,.row)[data-k="4"]{opacity:1}
.slide[data-act="1"] .v-k[data-k="1"],.slide[data-act="2"] .v-k[data-k="2"],.slide[data-act="3"] .v-k[data-k="3"],.slide[data-act="4"] .v-k[data-k="4"]{filter:drop-shadow(0 0 14px rgba(0,216,246,.9))}
.slide[data-act="1"] .row[data-k="1"],.slide[data-act="2"] .row[data-k="2"],.slide[data-act="3"] .row[data-k="3"],.slide[data-act="4"] .row[data-k="4"]{background:linear-gradient(90deg,rgba(0,216,246,.2),transparent 85%);padding-left:18px}
.slide[data-act="1"] .row[data-k="1"]::after,.slide[data-act="2"] .row[data-k="2"]::after,.slide[data-act="3"] .row[data-k="3"]::after,.slide[data-act="4"] .row[data-k="4"]::after{transform:scaleX(1)}
.v-k{cursor:pointer;transition:opacity .3s,filter .3s}

#bgw{position:absolute;left:-760px;top:0;width:3440px;height:1080px;background:linear-gradient(160deg,#05080f 0%,#0a1019 48%,#0f1827 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 760px,#000 calc(100% - 760px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 760px,#000 calc(100% - 760px),transparent 100%)}
.bgi{position:absolute;left:760px;top:0;width:1920px;height:1080px}
.gridbg{inset:auto;left:-760px;top:0;width:3440px;height:1080px}
#slides{overflow:hidden}
/* slide 5 */
.slide.s5{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding-top:6px}
.s5 .hd{position:relative;z-index:1}.s5 .lab{margin-bottom:14px}
.s5 .big{font-size:112px}.s5 .ttl h2{font-size:44px;max-width:1500px}
.grps{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:0 110px;margin-top:26px}
.grps::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;margin-left:-1px;background:linear-gradient(transparent,var(--cyan),transparent);background-size:100% 300px;background-repeat:repeat-y;opacity:.55;animation:vline 3.2s linear infinite}
@keyframes vline{from{background-position:0 -300px}to{background-position:0 700px}}
.gh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 20px}
.gno{font:700 84px/.9 var(--f-cond);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(0,216,246,.35))}
.gic{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:rgba(0,216,246,.08);color:var(--cyan)}.gic svg{width:28px;height:28px}
.gh h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:38px;line-height:1.15}
.chip{font-size:20px;font-weight:700;letter-spacing:.05em;color:#03141D;border-radius:999px;padding:8px 18px;background:var(--grad);box-shadow:0 0 24px rgba(0,216,246,.4);white-space:nowrap}
.gsub{margin:12px 0 0;font-size:23px;line-height:1.4;color:var(--muted)}
.s5 .rows{margin-top:18px}.s5 .row{padding:15px 0 16px;grid-template-columns:62px minmax(0,1fr)}
.s5 .row h3{font-size:30px}.s5 .row p{font-size:22px;margin-top:5px}.s5 .idx{font-size:21px}
.year{margin-top:20px}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.m{position:relative;text-align:center;cursor:default}
.m i{display:block;height:14px;border-radius:4px;background:var(--grad);box-shadow:0 0 14px rgba(0,216,246,.5);transform-origin:left;animation:fillm .55s both;animation-delay:calc(var(--m)*80ms + 1100ms);transition:transform .25s,filter .25s}
.m:hover i{filter:brightness(1.35);transform:scaleY(1.8)}
.m b{display:block;margin-top:8px;font:700 17px/1 var(--f-cond);color:var(--muted)}
.pin{position:absolute;left:-2px;top:-34px;width:26px;height:26px;color:var(--cyan);animation:pulse 2.4s ease-in-out infinite}.pin svg{width:100%;height:100%}
/* bottom */
.bot{position:absolute;left:0;right:0;bottom:38px;height:96px;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 96px 10px;gap:30px}
#u-hint{font-size:19px;color:var(--faint)}#u-hint b{color:var(--muted);font-weight:700}
.nav{display:flex;align-items:center;gap:22px}
/* Larger, brighter page navigation controls */
.bot .nav .ib{width:76px;height:76px;border:1.5px solid rgba(0,216,246,.72);background:rgba(0,216,246,.16);color:#35e5ff;box-shadow:0 0 18px rgba(0,216,246,.16),inset 0 0 14px rgba(0,216,246,.07)}
.bot .nav .ib svg{width:34px;height:34px;filter:drop-shadow(0 0 5px rgba(0,216,246,.45))}
.bot .nav .ib:hover:not(:disabled){background:rgba(0,216,246,.3);border-color:#65efff;box-shadow:0 0 30px rgba(0,216,246,.42),inset 0 0 16px rgba(0,216,246,.12);transform:scale(1.08)}
.bot .nav .ib:disabled{opacity:.48}
.bot .nav .ib:focus-visible{outline:2px solid #65efff;outline-offset:4px}

.segs{display:flex;gap:10px}
.seg{position:relative;width:104px;padding:10px 0 0;border:0;background:none;cursor:pointer;text-align:left}
.seg i{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.seg i::after{content:"";position:absolute;inset:0;background:var(--grad);box-shadow:0 0 12px rgba(0,216,246,.7);transform:scaleX(0);transform-origin:0 0;transition:transform .6s cubic-bezier(.2,.7,.1,1)}
.seg.vis i::after{transform:scaleX(1);opacity:.5}.seg.on i::after{transform:scaleX(1);opacity:1}
.seg b{display:block;margin-top:8px;font:700 16px/1 var(--f-cond);letter-spacing:.1em;color:#6A7F98;transition:color .3s}
.seg:hover b,.seg.on b{color:var(--cyan)}.seg:hover i{background:rgba(0,216,246,.3)}
.count{justify-self:end;font:700 26px/1 var(--f-cond);letter-spacing:.12em;color:var(--muted)}.count b{color:var(--cyan)}
/* overview */
#ov{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;padding:70px 96px;background:#04080e;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#ov.on{opacity:1;visibility:visible}
.ovh{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.ovh .label{font-size:30px}.pill{font:700 22px/1 var(--f-cond);letter-spacing:.1em;color:var(--cyan);border:1px solid var(--line);border-radius:999px;padding:9px 18px;background:rgba(0,216,246,.08)}
.ovg{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);border-top:1px solid var(--soft);border-left:1px solid var(--soft)}
.ovc{position:relative;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:30px 32px 34px;border:0;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);background:none;cursor:pointer;overflow:hidden;opacity:0;transform:translateY(40px) scale(.96);transition:background .35s,box-shadow .35s}
#ov.on .ovc{animation:rise .8s cubic-bezier(.16,.8,.2,1) both;animation-delay:calc(var(--d,0ms) + 150ms)}
.ovc .n{font:700 96px/.9 var(--f-cond);color:transparent;-webkit-text-stroke:2px rgba(0,216,246,.55);transition:all .35s}
.ovc .t{font-family:var(--f-head);font-weight:700;font-size:25px;line-height:1.25;color:var(--muted);transition:color .3s}
.ovc i{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--grad);transform:scaleX(0);transform-origin:0 0;transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.ovc:hover{background:linear-gradient(160deg,rgba(0,216,246,.2),rgba(0,163,255,.04))}
.ovc:hover .t,.ovc.cur .t{color:#fff}.ovc:hover i,.ovc.cur i{transform:scaleX(1)}
.ovc:hover .n,.ovc.cur .n{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 0 20px rgba(0,216,246,.5))}
.ovc.cur{background:linear-gradient(160deg,rgba(0,216,246,.14),transparent)}
.ovc.fill{cursor:default;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.025) 14px 15px)}
/* Simplified backgrounds: remove blur and ambient visual noise */
.aur,.gridbg,#fx,#glow,.vig{display:none!important}
.lang{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#ov{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.s5 .grps{margin-top:44px}.s5 .gno{font-size:98px}.s5 .gh h3{font-size:42px}.s5 .gsub{font-size:25px;margin-top:16px}
.s5 .rows{margin-top:24px}.s5 .row{padding:19px 0 20px}.s5 .row h3{font-size:34px}.s5 .row p{font-size:24px}
.s5 .year{margin-top:54px}.s5 .pin{top:-38px}

<body>
<div id="stage">
  <div id="bgw" aria-hidden="true"><div class="bgi"><div class="aur"><i></i><i></i><i></i></div>
  <div class="gridbg"></div>
  <canvas id="fx" width="1920" height="1080"></canvas></div></div>
  <div id="glow" aria-hidden="true"></div>

  /* 07 — productivity ↑, SLA time ↓, extra resources ↓, fast and accurate */

function bindLinks(el) {

function go(i, opts) {
  opts = opts || {};
